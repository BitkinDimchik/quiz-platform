openapi: 3.0.3
info:
  title: Quiz platform HTTP API
  version: 1.0.0
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /internal/quiz:
    post:
      summary: Создать квиз (требуется QUIZ_INTERNAL_API_KEY)
      security:
        - ApiKeyInternal: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizRequest'
      responses:
        '200':
          description: Созданный Quiz
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/Validation' }
  /api/session/start:
    post:
      summary: Старт игровой сессии
      security:
        - ApiKeySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionStartRequest'
      responses:
        '200':
          description: sessionId, roomCode, hostSecret
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/Validation' }
  /api/session/join:
    post:
      summary: Вход игрока в лобби
      security:
        - ApiKeySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionJoinRequest'
      responses:
        '200':
          description: playerId, reconnectToken
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/Validation' }
components:
  securitySchemes:
    ApiKeyInternal:
      type: apiKey
      in: header
      name: X-Api-Key
    ApiKeySession:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    CreateQuizRequest:
      type: object
      required: [ownerUserId, title]
      properties:
        ownerUserId: { type: string, format: uuid }
        title: { type: string, maxLength: 255 }
        slug: { type: string, nullable: true, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 20000 }
    SessionStartRequest:
      type: object
      required: [quizId]
      properties:
        quizId: { type: string, format: uuid }
        advanceMode:
          type: string
          enum: [automatic, manual]
    SessionJoinRequest:
      type: object
      required: [roomCode, displayName]
      properties:
        roomCode:
          type: string
          minLength: 4
          maxLength: 12
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        avatarUrl: { type: string, format: uri, nullable: true }
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
  responses:
    Unauthorized:
      description: Неверный или отсутствующий API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Validation:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
